<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <button
                class="sources-toggle"
                type="button"
                aria-controls="sources-panel"
                aria-expanded="false"
                aria-label="Открыть панель источников"
            >
                <span class="sources-toggle__icon" aria-hidden="true"></span>
                <span class="sources-toggle__text">sources</span>
            </button>
            <h1>News Portal</h1>
        </header>

        <button
            class="sources-overlay"
            type="button"
            tabindex="-1"
            aria-label="Закрыть панель источников"
            hidden
        ></button>

        <aside
            id="sources-panel"
            class="sources-panel"
            aria-label="sources news"
            aria-hidden="true"
            hidden
        >
            <div class="sources-panel__header">
                <h2 class="sources-panel__title">sources</h2>
                <button
                    class="sources-panel__close"
                    type="button"
                    aria-label="Закрыть панель источников"
                >
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="sources buttons"></div>
        </aside>

        <main>
            <div class="news"></div>
        </main>

        <footer>
            <div class="footer-container">
                <a class="rs-logo-link" href="https://rs.school/courses/javascript" target="_blank" rel="noopener noreferrer">
                    <img class="rs-logo-img" src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg" alt="RS School Logo">
                </a>
                <div class="copyright">
                    <span>2026</span>
                    <a href="https://github.com/mrGolbya" target="_blank" rel="noopener noreferrer">mrGolbya</a>
                </div>
            </div>
        </footer>

        <template id="sourceItemTemp">
            <button type="button" class="source__item" aria-pressed="false">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
